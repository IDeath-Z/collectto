# Spring Configuration
spring.application.name=api_collectto
spring.config.import=optional:file:.env[.properties]
spring.aop.proxy-target-class=false

# Token hash
jwt.secret=${JWT_SECRET}

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
collectto.purge-retention-days=30

# Oracle cloud bucket configuration
oracle.cloud.tenantId=${ORACLE_TENANT_ID}
oracle.cloud.userId=${ORACLE_USER_ID}
oracle.cloud.fingerprint=${ORACLE_FINGERPRINT}
oracle.cloud.region=${ORACLE_REGION}
oracle.cloud.namespace=${ORACLE_NAMESPACE}
oracle.cloud.bucket=${ORACLE_BUCKET}
oracle.cloud.privateKey=${ORACLE_PRIVATE_KEY}

# Storage Configuration
bucket.baseUrl=https://objectstorage.sa-saopaulo-1.oraclecloud.com/n/grb5h27yvmn6/b/collectto_storage/o
storage.path.profilePicture=profiles
storage.path.profileBackground=backgrounds
storage.path.collections=collections
storage.path.items=items
storage.presignedUrlExpirationMinutes=5

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS configuration
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://collectto.app,https://www.collectto.app}