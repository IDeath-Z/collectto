# Production-ready Docker Compose configuration for Collectto API with Caddy
# as a reverse proxy for secure HTTPS handling and static landing page hosting.
# Requires the collectto-landing repo cloned as a sibling directory (../collectto-landing).
# Run docker compose -f compose.yaml -f compose.prod.yaml up -d to start in production mode.
services:
  postgres:
    restart: always
  api:
    restart: always
    environment:
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: always
    ports:
      - '127.0.0.1:8080:80'
      - '127.0.0.1:8443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../collectto-landing:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

# Certificates and config for Caddy
volumes:
  caddy_data:
  caddy_config: