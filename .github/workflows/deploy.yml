name: Deploy Produção (Main)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ========================================================
  # JOB 1: Compilação do Projeto
  # ========================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout código
        uses: actions/checkout@v4.2.2

      - name: Setup Java 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compilar Projeto (Build)
        run: mvn compile -DskipTests

  # ========================================================
  # JOB 2: Execução de Testes Unitários
  # ========================================================
  test:
    name: Testes
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout código
        uses: actions/checkout@v4.2.2

      - name: Setup Java 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Executar Testes
        run: mvn test

  # ========================================================
  # JOB 3: Deploy na VPS (Executado exclusivamente no push da main)
  # ========================================================
  deploy:
    name: Deploy VPS
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout na VPS
        uses: actions/checkout@v4.2.2

      - name: Gerar .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Subir API e Banco (Docker com Auto-Restart)
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml up -d --build
